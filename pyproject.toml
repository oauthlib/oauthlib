[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "oauthlib"
dynamic = ["version"]
description = "A generic, spec-compliant, thorough implementation of the OAuth request-signing logic"
readme = {file = "README.rst", content-type = "text/x-rst"}
requires-python = ">=3.9"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "The OAuthlib Community"}]
maintainers = [{name = "Jonathan Huot", email = "jonathan.huot@gmail.com"}]
dependencies = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
rsa = ["cryptography>=3.0.0"]
signedtoken = ["cryptography>=3.0.0", "pyjwt>=2.0.0,<3"]
signals = ["blinker>=1.4.0"]

[project.urls]
Homepage = "https://github.com/oauthlib/oauthlib"
Changelog = "https://github.com/oauthlib/oauthlib/blob/master/CHANGELOG.rst"
Documentation = "https://oauthlib.readthedocs.io/"
Gitter = "https://gitter.im/oauthlib/Lobby"
Issues = "https://github.com/oauthlib/oauthlib/issues"
Source = "https://github.com/oauthlib/oauthlib"
Sponsor = "https://github.com/sponsors/JonathanHuot"

[tool.setuptools]
# Preserve the legacy Platform field, which has no PEP 621 equivalent.
platforms = ["any"]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
exclude = ["docs", "examples", "tests", "tests.*"]
namespaces = false

[tool.setuptools.dynamic]
version = {attr = "oauthlib.__version__"}

[tool.ruff]
exclude = ["flask-dance", "requests-oauthlib", "bottle-oauthlib", "django-oauth-toolkit"]
line-length = 255
target-version = "py37"

[tool.ruff.lint]
select = [
  "A",      # flake8-builtins
  "AIR",    # Airflow
  "ASYNC",  # flake8-async
  "BLE",    # flake8-blind-except
  "C4",     # flake8-comprehensions
  "C90",    # McCabe cyclomatic complexity
  "CPY",    # flake8-copyright
  "DJ",     # flake8-django
  "E",      # pycodestyle
  "EXE",    # flake8-executable
  "F",      # Pyflakes
  "FA",     # flake8-future-annotations
  "FLY",    # flynt
  "ICN",    # flake8-import-conventions
  "INP",    # flake8-no-pep420
  "INT",    # flake8-gettext
  "ISC",    # flake8-implicit-str-concat
  "N",      # pep8-naming
  "NPY",    # NumPy-specific rules
  "PD",     # pandas-vet
  "PERF",   # Perflint
  "PGH",    # pygrep-hooks
  "PIE",    # flake8-pie
  "PL",     # Pylint
  "PT",     # flake8-pytest-style
  "PYI",    # flake8-pyi
  "RSE",    # flake8-raise
  "RUF",    # Ruff-specific rules
  "S",      # flake8-bandit
  "SIM",    # flake8-simplify
  "SLOT",   # flake8-slots
  "T10",    # flake8-debugger
  "T20",    # flake8-print
  "TCH",    # flake8-type-checking
  "W",      # pycodestyle
  "YTT",    # flake8-2020
  # "ANN",  # flake8-annotations
  # "ARG",  # flake8-unused-arguments
  # "B",    # flake8-bugbear
  # "COM",  # flake8-commas
  # "D",    # pydocstyle
  # "DTZ",  # flake8-datetimez
  # "EM",   # flake8-errmsg
  # "ERA",  # eradicate
  # "FBT",  # flake8-boolean-trap
  # "FIX",  # flake8-fixme
  # "G",    # flake8-logging-format
  # "I",    # isort
  # "PTH",  # flake8-use-pathlib
  # "Q",    # flake8-quotes
  # "RET",  # flake8-return
  # "SLF",  # flake8-self
  # "TD",   # flake8-todos
  # "TID",  # flake8-tidy-imports
  # "TRY",  # tryceratops
  # "UP",   # pyupgrade
]
ignore = [
  "F401",
  "F403",
  "F405",
  "F841",
  "FLY002",
  "N806",
  "N818",
  "PERF401",
  "PLW2901",
  "PT008",
  "RSE102",
  "RUF005",
  "RUF012",
  "RUF013",
  "S105",
  "S106",
  "S107",
]
[tool.ruff.lint.mccabe]
max-complexity = 24  # default is 10

[tool.ruff.lint.per-file-ignores]
"docs/conf.py" = ["A001", "INP001"]
"oauthlib/oauth2/rfc6749/clients/base.py" = ["E722"]
"oauthlib/oauth2/rfc6749/endpoints/base.py" = ["BLE001"]
"oauthlib/openid/connect/core/grant_types/base.py" = ["BLE001"]
"tests/*" = ["PT009", "PT027", "S101"]
"oauthlib/oauth1/rfc5849/endpoints/resource.py" = ["A005"]
"oauthlib/oauth2/rfc6749/endpoints/resource.py" = ["A005"]
"oauthlib/oauth2/rfc6749/endpoints/token.py" = ["A005"]
"oauthlib/oauth2/rfc6749/parameters.py" = ["PLC0206"]
"oauthlib/oauth2/rfc6749/tokens.py" = ["RUF023"]
"oauthlib/openid/connect/core/tokens.py" = ["RUF023"]

[tool.ruff.lint.pylint]
allow-magic-value-types = ["int", "str"]
max-args = 16  # default is 5
max-branches = 24  # default is 12
max-statements = 56  # default is 50

[tool.coverage.run]
branch = true
cover_pylib = false
omit = ["oauthlib.tests.*"]

[tool.coverage.report]
omit = ["*/python?.?/*", "*/site-packages/*", "*/pypy/*"]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __debug__:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "noqa",
]
