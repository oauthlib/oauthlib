name: Python Tests
run-name: Run Tests by ${{ github.actor }}
on: [push, pull_request, workflow_dispatch]
jobs:
  tests:
    env:
      FORCE_COLOR: 1
    strategy:
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Check out repository code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install prereq
        run: pip install tox coveralls
      - name: Run python tests
        run: tox -e ${{ matrix.python }}
      - name: Coveralls
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_FLAG_NAME: ${{ matrix.python-version }}
          COVERALLS_PARALLEL: true
        run: coveralls
  coveralls:
    name: Indicate completion to coveralls.io
    needs: tests
    runs-on: ubuntu-latest
    container: python:3-slim
    permissions:
      contents: read
    steps:
      - name: Finished
        run: |
          pip3 install --upgrade coveralls
          coveralls --service=github --finish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  docs:
    strategy:
      matrix:
        toxenv: ["docs", "readme"]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: sudo apt install -y graphviz
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check out repository code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install prereq
        run: pip install tox
      - name: Run python tests
        run: tox -e ${{ matrix.toxenv }}
  build:
    name: Build oauthlib distribution
    needs:
      - tests
      - docs
      - coveralls
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check out repository code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install pypa/build
        run: >-
          python3 -m
          pip install
          build
          --user
      - name: Build wheel and tarball
        run: python3 -m build
      - name: Store the package's artifact
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
  pypi-publish:
    if: success() && github.repository == 'oauthlib/oauthlib' && github.ref_type == 'tag'
    needs:
      - build
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/oauthlib
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v6
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
  github-release:
    if: success() && github.repository == 'oauthlib/oauthlib' && github.ref_type == 'tag'
    needs:
      - build
    name: Create GitHub Release from CHANGELOG
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Check out repository code
      uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Extract changelog section for this version
      run: |
        python3 - <<'EOF'
        import os
        import re

        tag = os.environ['GITHUB_REF_NAME']
        version = tag.removeprefix('v')
        changelog = open('CHANGELOG.rst', encoding='utf-8').read()

        pattern = re.escape(version) + r' \(\d{4}-\d{2}-\d{2}\):\n-+\n'
        match = re.search(pattern, changelog)
        if not match:
            raise SystemExit('No changelog section found for version ' + version)

        rest = changelog[match.end():]
        next_section = re.search(r'\n\d+\.\d+\.\d+ \(', rest)
        section = rest[:next_section.start()] if next_section else rest

        with open('release-notes.md', 'w', encoding='utf-8') as f:
            f.write(section.strip())
        EOF
    - name: Download all the dists
      uses: actions/download-artifact@v6
      with:
        name: python-package-distributions
        path: dist/
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        body_path: release-notes.md
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
