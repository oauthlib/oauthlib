# require tox>=4
[tox]
envlist = py39,py310,py311,py312,py313,py314,py314t,pypy3,example,docs,readme,ruff

[testenv]
deps=
    -rrequirements-test.txt
commands=
    pytest --cov=oauthlib tests/

# tox -e example: end-to-end test of examples/fastapi_async_sqlalchemy.py.
# Kept out of the main matrix because its deps don't build everywhere
# (e.g. free-threaded CPython); tests/test_example_fastapi.py skips without them.
[testenv:example]
basepython=python3.11
deps=
    -rrequirements-test.txt
    -rexamples/requirements.txt
commands=
    pytest tests/test_example_fastapi.py

# tox -e docs to mimic readthedocs build.
[testenv:docs]
basepython=python3.11
skipsdist=True
deps=
        sphinx
        sphinx_rtd_theme
changedir=docs
allowlist_externals=make
commands=make clean html

# tox -e readme to mimic PyPI long_description check
[testenv:readme]
basepython=python3.11
deps=twine>=1.12.0
allowlist_externals=echo
commands=
        twine check .tox/.pkg/dist/*

[testenv:ruff]
deps=ruff
allowlist_externals=ruff
skip_install=true
commands=ruff check .
